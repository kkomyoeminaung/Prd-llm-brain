apiVersion: apps/v1
kind: Deployment
metadata:
  name: prd-llm
  labels:
    app: prd-llm
spec:
  replicas: 3
  selector:
    matchLabels:
      app: prd-llm
  template:
    metadata:
      labels:
        app: prd-llm
    spec:
      containers:
      - name: prd-llm
        image: pyothu/prd-llm:latest
        ports:
        - containerPort: 8000
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "8Gi"
            cpu: "4"
          requests:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: prd-llm-service
spec:
  selector:
    app: prd-llm
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
